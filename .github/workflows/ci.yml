# CI：编译验证 + 资源指标看门 + tag 发布。
# 体积上限来自规格 NFR-01（分发 ≤ 4 MB，只紧不松）；内存/CPU 指标需真机
# 蓝牙环境与常驻运行，不在 CI 覆盖范围（验收靠 DoD 手动项）。
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      # clippy 编译完成后 build 为增量，两步合并代价可忽略
      - name: clippy（零警告门禁）
        run: cargo clippy --release --target $env:TARGET -- -D warnings

      - name: 构建 Release
        run: cargo build --release --target $env:TARGET

      - name: 体积看门（NFR-01 分发 ≤ 4 MB）
        shell: pwsh
        run: |
          $exe = "target/$env:TARGET/release/btiny.exe"
          $size = (Get-Item $exe).Length
          Write-Host "btiny.exe: $([math]::Round($size / 1MB, 3)) MB（硬性上限 4 MB）"
          if ($size -gt 4MB) {
            Write-Host "::error::体积超标：$size 字节 > $((4MB)) 字节，违反 NFR-01（规格指标只紧不松）"
            exit 1
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: btiny-win-x64
          path: target/${{ env.TARGET }}/release/btiny.exe
          if-no-files-found: error

      - name: 发布 Release（tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ env.TARGET }}/release/btiny.exe
          generate-release-notes: true

      # 鹊桥同款：Release 资产经 gitee-sync 云函数中转到 Gitee（香港 Region
      # 治 runner 直传跨洲超时；多仓库共用同一函数，GITEE_SYNC_URL/SYNC_SECRET
      # 与 QueQiao/DeepSeek-Otter 仓库同款约定）。secrets 未配置跳过不阻塞发版。
      - name: 同步 btiny.exe 到 Gitee Release（云函数中转，可选）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEE_SYNC_URL: ${{ secrets.GITEE_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        shell: bash
        run: |
          if [ -z "${GITEE_SYNC_URL}" ] || [ -z "${SYNC_SECRET}" ]; then
            echo "未配置 GITEE_SYNC_URL/SYNC_SECRET secrets，跳过 Gitee 资产中转"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "同步 btiny.exe → Gitee Release（云函数中转）"
          # -G --data-urlencode：secret 含 +/&/空格等字符时直拼 URL 会被网关解码变形（鹊桥同款教训）
          code=$(curl -s -o gitee-sync-resp.json -w "%{http_code}" --max-time 600 -G \
            --data-urlencode "secret=${SYNC_SECRET}" \
            --data-urlencode "version=${VERSION}" \
            --data-urlencode "gh_repo=linxunxr/BTiny" \
            --data-urlencode "owner=mwcxlinxun" \
            --data-urlencode "repo=BTiny" \
            --data-urlencode "files=btiny.exe" \
            "${GITEE_SYNC_URL}")
          cat gitee-sync-resp.json || true
          if [ "$code" != "200" ]; then
            echo "::warning::Gitee 资产中转未成功（HTTP ${code}）——不阻塞发版，可手动跑 Resync Gitee 工作流（云函数幂等）"
          fi
