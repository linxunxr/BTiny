# 镜像同步：GitHub → Gitee（runner 境外出口，双向直连两站均畅通）。
# 依赖仓库 Secrets：GITEE_USER（Gitee 用户名）、GITEE_TOKEN（Gitee 私人令牌，
# 需 projects 权限）。Gitee 侧需预先存在同名空仓库（勿勾选初始化 README）。
# 注意：secrets 不进 job 级 if 表达式（会引发无 job 的启动失败），由步骤级判断承接。
name: Sync to Gitee

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GITEE_USER: ${{ secrets.GITEE_USER }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: 检查 Secrets
        id: check
        run: |
          if [ -z "$GITEE_USER" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 GITEE_USER/GITEE_TOKEN Secrets，跳过镜像（配置后可用 workflow_dispatch 手动触发验证）"
          fi

      - name: bare clone 并镜像推送
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --bare "https://github.com/${{ github.repository }}.git" repo.git
          cd repo.git
          git push --mirror "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/BTiny.git"
